<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opensoch</title>
<style>
  :root{
    --cols:23; --rows:19;
    --brain-w:min(520px,80vw);
    --t:calc(var(--brain-w)/var(--cols));

    --black:#000; --white:#fff;

    --purple:#7B2382;   /* Experiences  top-left  */
    --blue:#0B63C5;     /* Coaching     top-right */
    --red:#D42A18;      /* Backstory    bottom-left */
    --yellow:#F5D046;   /* Playground   bottom-right */

    --heal:300ms;              /* grid seams dissolving into the solid logo */
    --reveal:600ms;            /* the logo dissolving into the colour state */
    --flip:420ms;              /* full flip duration */
    --spread:calc(var(--t)*0.75);   /* cluster slide distance */

    /* wordmark block, placed on the tile grid. Fitted so every letterform
       pixel lands on a filled tile - a black letter over a gap is invisible,
       which is what broke the old overlay. Block aspect is 640:312. */
    --wm-cols:12;              /* block width, in tiles */
    --wm-left:6.75;            /* block origin, in tiles from the grid corner */
    --wm-top:6.75;

    /* screen 4 state levels */
    --veil-neutral:.34;        /* all four, equal mid-brightness */
    --veil-dim:.68;            /* the three that are not live */
    --state:200ms;             /* cross-fade between region states */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--black); color:var(--white);
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; overflow:hidden;
  }

  #stage{ position:relative; width:var(--brain-w); height:calc(var(--t)*var(--rows)); }

  #brain{ position:absolute; inset:0; perspective:900px; }
  #brain.alive{ animation:breathe 6s ease-in-out infinite; }
  @keyframes breathe{
    0%,100%{ transform:translateY(0) scale(1) }
    50%    { transform:translateY(-8px) scale(1.015) }
  }

  .region{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transition:transform var(--flip) cubic-bezier(.22,.61,.36,1);
  }

  /* one colour token per region, shared by tiles, glow and label */
  .region--tl,.glowreg--tl,.label--tl{ --c:var(--purple) }
  .region--tr,.glowreg--tr,.label--tr{ --c:var(--blue) }
  .region--bl,.glowreg--bl,.label--bl{ --c:var(--red) }
  .region--br,.glowreg--br,.label--br{ --c:var(--yellow) }

  .tile{
    position:absolute;
    width:var(--t); height:var(--t);
    background:var(--white);
    transform:rotateY(90deg);
    opacity:0;
  }
  .tile.on{
    transform:rotateY(0deg);
    opacity:1;
    transition:transform 160ms ease-out, opacity 160ms ease-out;
  }
  .tile.seed{ transform:rotateY(0); opacity:1; animation:throb 620ms ease-in-out infinite; }
  @keyframes throb{
    0%,100%{ opacity:.28; transform:rotateY(0) scale(.86) }
    50%    { opacity:1;   transform:rotateY(0) scale(1) }
  }

  /* two overlays per tile, so screen 4 never touches the tile's own
     background-color and the midpoint colour swap stays exactly as built.
     ::before = region state veil, ::after = neuron pulse flash. */
  .tile::before,.tile::after{ content:''; position:absolute; inset:0 }
  .tile::before{
    background:#000; opacity:0;
    transition:opacity var(--state) ease;
  }
  .tile::after{ background:#fff; opacity:0 }
  .tile.fire::after{ animation:fire 340ms ease-out }
  @keyframes fire{ 0%{opacity:0} 20%{opacity:.92} 100%{opacity:0} }

  /* ---- the assembled logo ----
     The rest state is not 242 tiles, it is one path. Adjacent tiles are
     subpaths of a single fill, so the edges they share are interior to that
     fill and no seam is drawn between them - at any zoom, and under the
     breathing scale, which is what made the grid show through before.
     The tiles are only ever on screen for the intro and the hover. */
  #solid{
    position:absolute; inset:0; pointer-events:none;
    opacity:0;
    transition:opacity var(--heal) ease;
  }
  #solid path{ fill:var(--white) }
  #stage.assembled #solid{ opacity:1 }
  /* one way only: the white logo belongs to the load sequence. Once it has
     dissolved into the colour state it never returns. */
  #stage.coloured #solid{ opacity:0; transition:opacity var(--reveal) ease }

  /* the tiles sit behind the solid logo while it holds, then take over as it
     dissolves. Never a fractional opacity on .region during the flip: that
     makes a stacking context and flattens preserve-3d underneath it. */
  #stage.assembled .region{ opacity:0; transition:opacity 0ms var(--heal) }
  #stage.assembled.coloured .region{ opacity:1; transition:opacity 0ms }

  /* any input during the load sequence snaps straight to the rest state */
  #stage.snap :is(#solid,#wordmark,.region,.tile){
    transition:none !important; animation:none !important;
  }

  /* ---- the colour state ----
     Colour now arrives in the load sequence, not on hover, so the tiles are
     already their region colour by the time anything flips. That retires the
     midpoint colour swap: there is no longer a colour change to hide inside
     the flip. Background changes instantly, unanimated. */
  #stage.coloured .region .tile{ background:var(--c) }

  /* ---- SCREEN 3: the flip ---- */
  #stage.ready .tile.on{
    transition:transform var(--flip) cubic-bezier(.22,.61,.36,1);
  }
  #stage.ready:is(:hover,.open) .tile.on{ transform:rotateY(180deg); }

  /* clusters open outward on their own diagonals */
  #stage.ready:is(:hover,.open) .region--tl,
  #stage.ready:is(:hover,.open) .glowreg--tl{ transform:translate(calc(var(--spread)*-1), calc(var(--spread)*-1)) }
  #stage.ready:is(:hover,.open) .region--tr,
  #stage.ready:is(:hover,.open) .glowreg--tr{ transform:translate(var(--spread),           calc(var(--spread)*-1)) }
  #stage.ready:is(:hover,.open) .region--bl,
  #stage.ready:is(:hover,.open) .glowreg--bl{ transform:translate(calc(var(--spread)*-1), var(--spread)) }
  #stage.ready:is(:hover,.open) .region--br,
  #stage.ready:is(:hover,.open) .glowreg--br{ transform:translate(var(--spread),           var(--spread)) }

  /* ---- SCREEN 4: per-region states ---- */
  /* neutral: cursor inside the box but on no tile. all four equal, no glow. */
  #stage.ready.neutral .region{ --veil:var(--veil-neutral) }
  /* live: one region at full colour, the other three pushed back */
  #stage.ready.live .region{ --veil:var(--veil-dim) }
  #stage.ready.live .region.is-live{ --veil:0 }
  #stage.ready:is(:hover,.open) .region .tile::before{ opacity:var(--veil,0) }

  /* outer bloom for the live region. lives outside the 3D subtrees so its
     blur/blend cannot flatten preserve-3d on the tiles. */
  #glow{ position:absolute; inset:0; pointer-events:none }
  .glowreg{
    position:absolute; inset:0;
    opacity:0;
    filter:blur(calc(var(--t)*0.45));
    mix-blend-mode:screen;
    transition:opacity var(--state) ease,
               transform var(--flip) cubic-bezier(.22,.61,.36,1);
  }
  #stage.ready.live .glowreg.is-live{ opacity:.6 }
  .gcell{ position:absolute; width:var(--t); height:var(--t); background:var(--c) }

  /* ---- labels: hover-only, anchored to the region's outer corner ---- */
  #labels{ position:absolute; inset:0; pointer-events:none }
  .label{
    position:absolute;
    appearance:none; background:none; border:0; padding:.2em .1em;
    font:600 clamp(.68rem,1.35vw,.9rem)/1 inherit;
    letter-spacing:.16em; text-transform:uppercase;
    /* lifted off the region colour so it stays legible on black.
       still derived from the :root hex, not a second hardcoded value. */
    color:color-mix(in srgb, var(--c) 60%, #fff);
    white-space:nowrap; cursor:pointer;
    opacity:0; pointer-events:auto;
    transition:opacity var(--state) ease,
               translate var(--flip) cubic-bezier(.22,.61,.36,1);
  }
  .label--tl{ left:0;  bottom:calc(100% + var(--t)*.45) }
  .label--tr{ right:0; bottom:calc(100% + var(--t)*.45) }
  .label--bl{ left:0;  top:calc(100% + var(--t)*.45) }
  .label--br{ right:0; top:calc(100% + var(--t)*.45) }
  /* labels ride the same diagonal the clusters open along */
  #stage.ready:is(:hover,.open) .label--tl{ translate:calc(var(--spread)*-1) calc(var(--spread)*-1) }
  #stage.ready:is(:hover,.open) .label--tr{ translate:var(--spread)           calc(var(--spread)*-1) }
  #stage.ready:is(:hover,.open) .label--bl{ translate:calc(var(--spread)*-1) var(--spread) }
  #stage.ready:is(:hover,.open) .label--br{ translate:var(--spread)           var(--spread) }
  #stage.ready.live .label.is-live{ opacity:1 }
  .label{ text-decoration:none }
  /* a live region is a link target */
  #stage.ready.live{ cursor:pointer }
  .label:focus-visible{ opacity:1; outline:1px solid currentColor; outline-offset:.4em }

  /* wordmark: black letterforms over the tiles. hidden at the flip midpoint.
     Drawn as vector rather than a raster overlay - the letterforms are finer
     than the tiles and cannot be expressed in them, but they can be drawn
     exactly. Geometry is measured from the original artwork: a 5x5 module
     grid, 26 unit stroke, 130 unit glyph, 170 advance, 182 line pitch. */
  #wordmark{
    position:absolute;
    left:calc(var(--t) * var(--wm-left));
    top:calc(var(--t) * var(--wm-top));
    width:calc(var(--t) * var(--wm-cols));
    height:calc(var(--t) * var(--wm-cols) * 312 / 640);
    pointer-events:none;
    opacity:1;
  }
  #wordmark svg{ display:block; width:100%; height:100% }
  /* the letterforms dissolve together with the white logo they are carved from */
  #stage.coloured #wordmark{ opacity:0; transition:opacity var(--reveal) ease }

  footer{
    position:fixed; bottom:1.25rem; left:0; right:0;
    text-align:center; font-size:.7rem; color:#3a3a3a;
  }
  footer a{color:inherit;text-decoration:none;margin:0 .5rem}
  footer a:hover{color:#777}

  @media (prefers-reduced-motion:reduce){
    #brain.alive{animation:none}
    .tile.on,.tile.seed{transition:none;animation:none}
    .region{transition:none}
    .tile.fire::after{animation:none}
  }
</style>
</head>

<script>
const COLS=23, ROWS=19;
const TILES=[[0,0,"tl"],[19,0,"tr"],[1,2,"tl"],[2,2,"tl"],[4,2,"tl"],[9,2,"tl"],[10,2,"tl"],[11,2,"tl"],[12,2,"tr"],[13,2,"tr"],[14,2,"tr"],[15,2,"tr"],[22,2,"tr"],[1,3,"tl"],[2,3,"tl"],[5,3,"tl"],[6,3,"tl"],[7,3,"tl"],[8,3,"tl"],[9,3,"tl"],[10,3,"tl"],[11,3,"tl"],[12,3,"tr"],[13,3,"tr"],[14,3,"tr"],[15,3,"tr"],[16,3,"tr"],[17,3,"tr"],[20,3,"tr"],[21,3,"tr"],[4,4,"tl"],[5,4,"tl"],[6,4,"tl"],[7,4,"tl"],[8,4,"tl"],[9,4,"tl"],[10,4,"tl"],[11,4,"tl"],[12,4,"tr"],[13,4,"tr"],[14,4,"tr"],[15,4,"tr"],[16,4,"tr"],[17,4,"tr"],[18,4,"tr"],[20,4,"tr"],[21,4,"tr"],[6,5,"tl"],[7,5,"tl"],[8,5,"tl"],[9,5,"tl"],[10,5,"tl"],[11,5,"tl"],[12,5,"tr"],[13,5,"tr"],[14,5,"tr"],[15,5,"tr"],[16,5,"tr"],[18,5,"tr"],[2,6,"tl"],[4,6,"tl"],[5,6,"tl"],[6,6,"tl"],[7,6,"tl"],[8,6,"tl"],[9,6,"tl"],[10,6,"tl"],[11,6,"tl"],[12,6,"tr"],[13,6,"tr"],[14,6,"tr"],[15,6,"tr"],[16,6,"tr"],[20,6,"tr"],[1,7,"tl"],[2,7,"tl"],[4,7,"tl"],[5,7,"tl"],[6,7,"tl"],[7,7,"tl"],[8,7,"tl"],[9,7,"tl"],[10,7,"tl"],[11,7,"tl"],[12,7,"tr"],[13,7,"tr"],[14,7,"tr"],[15,7,"tr"],[16,7,"tr"],[17,7,"tr"],[18,7,"tr"],[20,7,"tr"],[0,8,"tl"],[1,8,"tl"],[2,8,"tl"],[3,8,"tl"],[4,8,"tl"],[5,8,"tl"],[6,8,"tl"],[7,8,"tl"],[8,8,"tl"],[9,8,"tl"],[10,8,"tl"],[11,8,"tl"],[12,8,"tr"],[13,8,"tr"],[14,8,"tr"],[15,8,"tr"],[16,8,"tr"],[17,8,"tr"],[18,8,"tr"],[19,8,"tr"],[20,8,"tr"],[21,8,"tr"],[0,9,"tl"],[1,9,"tl"],[2,9,"tl"],[3,9,"tl"],[4,9,"tl"],[5,9,"tl"],[6,9,"tl"],[7,9,"tl"],[8,9,"tl"],[9,9,"tl"],[10,9,"tl"],[11,9,"tl"],[12,9,"tr"],[13,9,"tr"],[14,9,"tr"],[15,9,"tr"],[16,9,"tr"],[17,9,"tr"],[18,9,"tr"],[19,9,"tr"],[20,9,"tr"],[21,9,"tr"],[22,9,"tr"],[0,10,"bl"],[1,10,"bl"],[2,10,"bl"],[4,10,"bl"],[5,10,"bl"],[6,10,"bl"],[7,10,"bl"],[8,10,"bl"],[9,10,"bl"],[10,10,"bl"],[11,10,"bl"],[12,10,"br"],[13,10,"br"],[14,10,"br"],[15,10,"br"],[16,10,"br"],[17,10,"br"],[18,10,"br"],[19,10,"br"],[20,10,"br"],[21,10,"br"],[1,11,"bl"],[2,11,"bl"],[3,11,"bl"],[6,11,"bl"],[7,11,"bl"],[8,11,"bl"],[9,11,"bl"],[10,11,"bl"],[11,11,"bl"],[12,11,"br"],[13,11,"br"],[14,11,"br"],[15,11,"br"],[16,11,"br"],[17,11,"br"],[18,11,"br"],[19,11,"br"],[20,11,"br"],[2,12,"bl"],[3,12,"bl"],[7,12,"bl"],[8,12,"bl"],[9,12,"bl"],[10,12,"bl"],[11,12,"bl"],[12,12,"br"],[13,12,"br"],[14,12,"br"],[15,12,"br"],[16,12,"br"],[17,12,"br"],[18,12,"br"],[19,12,"br"],[20,12,"br"],[4,13,"bl"],[5,13,"bl"],[6,13,"bl"],[7,13,"bl"],[8,13,"bl"],[9,13,"bl"],[10,13,"bl"],[11,13,"bl"],[12,13,"br"],[13,13,"br"],[14,13,"br"],[15,13,"br"],[16,13,"br"],[17,13,"br"],[18,13,"br"],[19,13,"br"],[6,14,"bl"],[7,14,"bl"],[8,14,"bl"],[9,14,"bl"],[10,14,"bl"],[11,14,"bl"],[12,14,"br"],[13,14,"br"],[14,14,"br"],[15,14,"br"],[16,14,"br"],[17,14,"br"],[18,14,"br"],[2,15,"bl"],[5,15,"bl"],[7,15,"bl"],[8,15,"bl"],[12,15,"br"],[13,15,"br"],[14,15,"br"],[15,15,"br"],[16,15,"br"],[17,15,"br"],[4,16,"bl"],[14,16,"br"],[15,16,"br"],[16,16,"br"],[21,16,"br"],[15,17,"br"],[16,17,"br"],[18,17,"br"],[19,17,"br"],[18,18,"br"],[19,18,"br"]];               // [col, row, region]

const REGS=['tl','tr','bl','br'];
const stage=document.getElementById('stage');

/* Whole-pixel tiles. At a fractional tile size adjacent tiles share an
   antialiased edge; two half-covered veils there composite to less than one
   full veil, so every seam reads as a bright hairline across a dimmed
   region. Snapping --t to an integer makes the tiles abut exactly. */
function snapTile(){
  const root=document.documentElement;
  root.style.removeProperty('--t');
  root.style.removeProperty('--brain-w');
  const w=parseFloat(getComputedStyle(stage).width);
  const t=Math.max(6,Math.floor(w/COLS));
  root.style.setProperty('--t', t+'px');
  root.style.setProperty('--brain-w', (t*COLS)+'px');
}
snapTile();
addEventListener('resize', snapTile);
const brain=document.getElementById('brain');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const regions={}, glows={}, labels={};
for(const k of REGS){
  regions[k]=document.querySelector('.region--'+k);
  glows[k]  =document.querySelector('.glowreg--'+k);
  labels[k] =document.querySelector('.label--'+k);
}

const cx=(COLS-1)/2, cy=(ROWS-1)/2;
let seed=TILES[0], best=1e9;
for(const [c,r] of TILES){
  const d=(c-cx)**2+(r-cy)**2;
  if(d<best){ best=d; seed=[c,r]; }
}

const K=(c,r)=>c+','+r;
const cells=new Map();          // "c,r" -> {el, reg, c, r}
const els=[];
for(const [c,r,reg] of TILES){
  const d=document.createElement('div');
  d.className='tile';
  d.style.left=`calc(var(--t) * ${c})`;
  d.style.top =`calc(var(--t) * ${r})`;
  regions[reg].appendChild(d);
  els.push({el:d, dist:Math.hypot(c-seed[0], r-seed[1]), isSeed:(c===seed[0]&&r===seed[1])});

  // matching cell in the blur layer, so the bloom takes the region's own shape
  const g=document.createElement('div');
  g.className='gcell';
  g.style.left=d.style.left; g.style.top=d.style.top;
  glows[reg].appendChild(g);

  cells.set(K(c,r), {el:d, reg, c, r});
}

/* ---------- screen 1: preloader -> logo -> colour ----------
   Three beats. Tiles assemble as the preloader, the assembled logo holds,
   then it dissolves to reveal the colour state, which is the home page.

   The wave is a floor, not the whole gate: the sequence will not advance
   until the tiles have landed AND the page's assets have decoded. With no
   external artwork that is just the wave, but drop the official logo in as
   an <img> and it is genuinely waited on rather than raced. */
const maxDist=Math.max(...els.map(t=>t.dist));
const SPREAD=1500, HOLD=500, LOGO_HOLD=700;
const REVEAL=parseFloat(getComputedStyle(document.documentElement)
  .getPropertyValue('--reveal'))||700;
let done=false; const timers=[];

const assetsReady=Promise.all([
  ...[...document.images].map(i=>i.decode().catch(()=>{})),
  document.fonts ? document.fonts.ready.catch(()=>{}) : null
]);

function showLogo(){                 // beat 2: the assembled logo
  els.forEach(t=>{ t.el.classList.remove('seed'); t.el.classList.add('on'); });
  stage.classList.add('assembled');
  brain.classList.add('alive');
}

function toColour(){                 // beat 3: dissolve into the region colours
  stage.classList.add('coloured');
  // hover is inert until the reveal has finished
  timers.push(setTimeout(()=>stage.classList.add('ready'), REVEAL));
}

function skip(){                     // any input: straight to the rest state
  if(done) return; done=true;
  timers.forEach(clearTimeout); timers.length=0;
  stage.classList.add('snap');
  showLogo();
  stage.classList.add('coloured','ready');
  requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.remove('snap')));
}

function run(){
  if(reduce){ skip(); return; }
  const s=els.find(t=>t.isSeed);
  s.el.classList.add('seed');
  timers.push(setTimeout(()=>{
    s.el.classList.remove('seed'); s.el.classList.add('on');
    for(const t of els){
      if(t.isSeed) continue;
      timers.push(setTimeout(()=>t.el.classList.add('on'), (t.dist/maxDist)*SPREAD));
    }
    const wave=new Promise(r=>timers.push(setTimeout(r, SPREAD+250)));
    Promise.all([wave, assetsReady]).then(()=>{
      if(done) return; done=true;
      showLogo();
      timers.push(setTimeout(toColour, LOGO_HOLD));
    });
  }, HOLD));
}

['click','keydown','touchstart'].forEach(ev=>
  addEventListener(ev, skip, {once:true, passive:true}));

run();

/* ---------- screen 4: per-tile region detection ---------- */
/* Each cluster is translated outward on its own diagonal, so a screen point
   maps to a different grid cell per region. The four candidate cells can
   never both be inside their own region (the offsets always push the
   candidate the wrong side of the centre cut), so the hit is unambiguous. */
const SIGN={tl:[-1,-1], tr:[1,-1], bl:[-1,1], br:[1,1]};

function tileSize(){ return stage.getBoundingClientRect().width/COLS; }

function hitTest(clientX, clientY){
  const r=brain.getBoundingClientRect();
  if(!r.width) return null;
  const t=r.width/COLS;                       // tile size as drawn, breathing included
  const sp=isOpen ? t*0.75 : 0;               // --spread, and only once open
  const x=clientX-r.left, y=clientY-r.top;
  for(const reg of REGS){
    const [sx,sy]=SIGN[reg];
    const c=Math.floor((x-sx*sp)/t), rw=Math.floor((y-sy*sp)/t);
    const cell=cells.get(K(c,rw));
    if(cell && cell.reg===reg) return reg;
  }
  return null;
}

/* ---------- neuron pulses ---------- */
/* Paths are walked over the region's own orthogonal adjacency, taken straight
   from the tile map. Straight runs are strongly preferred; the walk only
   turns when it runs out of region, so every pulse is a run of 90 degree
   segments and never a freeform diagonal. */
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const byRegion={tl:[],tr:[],bl:[],br:[]};
for(const cell of cells.values()) byRegion[cell.reg].push(cell);

// components of fewer than 4 cells cannot carry a run; skip them as origins
const originsOf={};
for(const reg of REGS){
  const set=new Set(byRegion[reg].map(c=>K(c.c,c.r)));
  const seen=new Set(); const ok=[];
  for(const cell of byRegion[reg]){
    const start=K(cell.c,cell.r);
    if(seen.has(start)) continue;
    const stack=[cell], comp=[]; seen.add(start);
    while(stack.length){
      const cur=stack.pop(); comp.push(cur);
      for(const [dx,dy] of DIRS){
        const k=K(cur.c+dx,cur.r+dy);
        if(set.has(k) && !seen.has(k)){ seen.add(k); stack.push(cells.get(k)); }
      }
    }
    if(comp.length>=4) ok.push(...comp);
  }
  originsOf[reg]=ok;
}

function walk(reg){
  const pool=originsOf[reg];
  if(!pool.length) return [];
  let cur=pool[Math.random()*pool.length|0];
  const seen=new Set([K(cur.c,cur.r)]);
  const path=[cur];
  const target=6+(Math.random()*9|0);
  let dir=null;
  while(path.length<target){
    const opts=DIRS.filter(([dx,dy])=>{
      const n=cells.get(K(cur.c+dx,cur.r+dy));
      return n && n.reg===reg && !seen.has(K(n.c,n.r));
    });
    if(!opts.length) break;
    const straight=dir && opts.find(d=>d[0]===dir[0] && d[1]===dir[1]);
    const pick=(straight && Math.random()<0.8) ? straight : opts[Math.random()*opts.length|0];
    cur=cells.get(K(cur.c+pick[0], cur.r+pick[1]));
    dir=pick;
    seen.add(K(cur.c,cur.r));
    path.push(cur);
  }
  return path;
}

const STEP=58;                 // ms between tiles: the pulse's travel speed
let pulseTimers=[], pulseLoop=null;

function firePath(reg){
  const path=walk(reg);
  if(path.length<4) return;
  path.forEach((cell,i)=>{
    pulseTimers.push(setTimeout(()=>{
      if(live!==reg) return;
      const el=cell.el;
      el.classList.remove('fire');
      void el.offsetWidth;      // restart the flash if this tile is still lit
      el.classList.add('fire');
    }, i*STEP));
  });
}

function stopPulses(){
  pulseTimers.forEach(clearTimeout); pulseTimers=[];
  clearInterval(pulseLoop); pulseLoop=null;
  document.querySelectorAll('.tile.fire').forEach(el=>el.classList.remove('fire'));
}

function startPulses(reg){
  if(reduce) return;
  firePath(reg);
  setTimeout(()=>{ if(live===reg) firePath(reg); }, 260);
  pulseLoop=setInterval(()=>{
    if(live!==reg) return stopPulses();
    firePath(reg);
    if(Math.random()<0.5) setTimeout(()=>{ if(live===reg) firePath(reg); }, 180);
  }, 620);
}

/* ---------- state ---------- */
let live=null, isOpen=false, px=0, py=0, raf=null;

function apply(reg){
  if(reg===live) return;
  live=reg;
  stage.classList.toggle('live', !!reg);
  stage.classList.toggle('neutral', isOpen && !reg);
  for(const k of REGS){
    const on=(k===reg);
    regions[k].classList.toggle('is-live', on);
    glows[k].classList.toggle('is-live', on);
    labels[k].classList.toggle('is-live', on);
  }
  stopPulses();
  if(reg) startPulses(reg);
}

function tick(){
  if(!isOpen) return;
  apply(hitTest(px,py));
  raf=requestAnimationFrame(tick);   // re-test every frame: the brain breathes
}

function open(){
  if(!done || isOpen) return;
  isOpen=true;
  stage.classList.add('open','neutral');
  if(raf) cancelAnimationFrame(raf);
  raf=requestAnimationFrame(tick);
}

function close(){
  if(!isOpen) return;
  isOpen=false;
  cancelAnimationFrame(raf); raf=null;
  apply(null);
  stage.classList.remove('open','neutral','live');
}

stage.addEventListener('pointermove', e=>{
  px=e.clientX; py=e.clientY;
  if(!isOpen) open(); else apply(hitTest(px,py));
});
stage.addEventListener('pointerenter', e=>{ px=e.clientX; py=e.clientY; open(); });
stage.addEventListener('pointerleave', close);

/* each region is its own link. Detection is the same per-tile test the hover
   uses, so the clickable area is the region's real shape - clicking a notch
   between the regions does nothing, exactly as it lights nothing. */
const ROUTES={tl:'/experiences', tr:'/coaching', bl:'/backstory', br:'/playground'};
stage.addEventListener('click', e=>{
  if(!stage.classList.contains('ready')) return;
  if(e.target.closest('.label')) return;     // the labels are already links
  const reg=hitTest(e.clientX, e.clientY);
  if(reg) location.href=ROUTES[reg];
});

/* keyboard: the four regions are tabbable and light their own region */
for(const k of REGS){
  labels[k].addEventListener('focus', ()=>{
    if(!done) skip();
    isOpen=true; stage.classList.add('open');
    stage.classList.remove('neutral');
    apply(k);
  });
  labels[k].addEventListener('blur', ()=>{
    if(!stage.matches(':hover')) close();
  });
}
</script>
</body>
